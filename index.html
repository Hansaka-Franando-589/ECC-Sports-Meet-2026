<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Travel Railway Station</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015); // ලස්සනට පේන්න පොඩි මීදුමක්

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadows On කිරීම
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. The Time Ring (කාලයන් වෙන් කරන තැටිය)
        // මේකෙන් තමයි ඇතුළට යන්නේ
        const ringGeo = new THREE.TorusGeometry(14, 1.5, 32, 100);
        const ringMat = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, // රන්වන් පාට
            metalness: 0.8, 
            roughness: 0.2 
        });
        const timeRing = new THREE.Mesh(ringGeo, ringMat);
        timeRing.rotation.y = Math.PI / 2; // රවුම හරවන්න
        scene.add(timeRing);

        // 4. Platform (වේදිකාව)
        const platformGeo = new THREE.BoxGeometry(40, 1, 12);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(0, -0.5, -5);
        platform.receiveShadow = true;
        scene.add(platform);

        // --- OLD ERA (වම් පැත්ත) ---

        // පරණ ගොඩනැගිල්ල (ගඩොල් පාට)
        const oldBuildingGeo = new THREE.BoxGeometry(18, 10, 8);
        const oldBuildingMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // දුඹුරු
        const oldBuilding = new THREE.Mesh(oldBuildingGeo, oldBuildingMat);
        oldBuilding.position.set(-10, 5, -5);
        scene.add(oldBuilding);

        // පරණ ගල් අඟුරු කෝච්චිය (කළු පාට Cylinder හැඩය)
        const oldTrainGeo = new THREE.CylinderGeometry(2, 2, 16, 32);
        const oldTrainMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const oldTrain = new THREE.Mesh(oldTrainGeo, oldTrainMat);
        oldTrain.rotation.z = Math.PI / 2;
        oldTrain.position.set(-10, 3, 5); // පීල්ල තියෙන හරිය
        scene.add(oldTrain);


        // --- MODERN ERA (දකුණු පැත්ත) ---

        // අලුත් ගොඩනැගිල්ල (වීදුරු වගේ ළා නිල් පාට)
        const newBuildingGeo = new THREE.BoxGeometry(18, 12, 8);
        const newBuildingMat = new THREE.MeshStandardMaterial({ 
            color: 0xadd8e6, 
            transparent: true, 
            opacity: 0.8 // වීදුරු වගේ පේන්න
        });
        const newBuilding = new THREE.Mesh(newBuildingGeo, newBuildingMat);
        newBuilding.position.set(10, 6, -5);
        scene.add(newBuilding);

        // නවීන අධිවේගී කෝච්චිය (සුදු පාට Bullet හැඩය)
                const newTrainGeo = new THREE.CylinderGeometry(2, 2, 12, 32);
        const newTrainMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const newTrain = new THREE.Mesh(newTrainGeo, newTrainMat);
        newTrain.rotation.z = Math.PI / 2;
        newTrain.position.set(10, 3, 5);
        scene.add(newTrain);


        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // රවුම් තැටිය හෙමින් කැරකෙනවා (Time travel effect එකක්)
            timeRing.rotation.z += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
